<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Parachord JS Runtime</title>
</head>
<body>
<script>
    // ── Console polyfill ─────────────────────────────────────────────
    // Route JS console output to Android's Log via NativeBridge
    const _console = {
        log: (...args) => NativeBridge.log('debug', args.map(String).join(' ')),
        info: (...args) => NativeBridge.log('info', args.map(String).join(' ')),
        warn: (...args) => NativeBridge.log('warn', args.map(String).join(' ')),
        error: (...args) => NativeBridge.log('error', args.map(String).join(' ')),
        debug: (...args) => NativeBridge.log('debug', args.map(String).join(' ')),
    };
    window.console = _console;

    // ── Async Fetch polyfill ────────────────────────────────────────
    // Override window.fetch to use NativeBridge.fetchAsync() which runs
    // HTTP requests on a background thread and calls back via JS.
    // This frees the WebView JS thread so multiple .axe plugin searches
    // can run concurrently (Bandcamp, SoundCloud, etc.) instead of
    // blocking sequentially.
    window.__fetchCallbacks = {};
    var __fetchIdCounter = 0;

    window.fetch = function(url, options) {
        options = options || {};
        var method = (options.method || 'GET').toUpperCase();
        var headers = JSON.stringify(options.headers || {});
        var body = typeof options.body === 'string' ? options.body
                 : options.body ? JSON.stringify(options.body) : '';

        var callbackId = 'fetch_' + (++__fetchIdCounter);

        return new Promise(function(resolve, reject) {
            window.__fetchCallbacks[callbackId] = function(envelopeStr) {
                delete window.__fetchCallbacks[callbackId];
                try {
                    var parsed = JSON.parse(envelopeStr);
                    var responseBody = parsed.body || '';
                    resolve({
                        ok: parsed.ok,
                        status: parsed.status,
                        statusText: parsed.ok ? 'OK' : 'Error',
                        text: function() { return Promise.resolve(responseBody); },
                        json: function() {
                            try { return Promise.resolve(JSON.parse(responseBody)); }
                            catch (e) { return Promise.reject(new Error('Invalid JSON')); }
                        },
                        headers: new Headers(),
                    });
                } catch (e) {
                    reject(new Error('Failed to parse fetch response: ' + e.message));
                }
            };

            try {
                NativeBridge.fetchAsync(callbackId, url, method, headers, body);
            } catch (e) {
                delete window.__fetchCallbacks[callbackId];
                reject(e);
            }
        });
    };

    // Keep nativeFetch as an alias for backward compatibility
    window.nativeFetch = window.fetch;

    // iTunesRateLimiter — applemusic.axe calls `window.iTunesRateLimiter.fetch(url)`
    // for its no-auth iTunes Search requests (searchAlbums / lookupAlbum, #424).
    // The host supplies it; it isn't in any .axe or resolver-loader.js. It never
    // mattered before because the NATIVE Apple Music resolver runs on Android, so
    // the .axe's own resolve() was never called. Requests are spaced 300ms apart
    // (iTunes Search throttles bursts); iOS supplies a passthrough.
    (function () {
        var last = 0;
        var chain = Promise.resolve();
        window.iTunesRateLimiter = {
            fetch: function (url, options) {
                var run = chain.then(function () {
                    var wait = Math.max(0, last + 300 - Date.now());
                    return new Promise(function (r) { setTimeout(r, wait); });
                }).then(function () {
                    last = Date.now();
                    return window.fetch(url, options);
                });
                chain = run.catch(function () {});
                return run;
            }
        };
    })();

    // ── Storage polyfill ─────────────────────────────────────────────
    // .axe plugins access config via nativeStorage. All keys are
    // namespaced under "plugin.<id>." by the resolver-loader before
    // reaching NativeBridge. Direct calls to NativeBridge.storageGet
    // with unprefixed keys are rejected by the Kotlin layer (security: C3).
    //
    // createPluginStorage(pluginId) returns a scoped {get, set} object
    // that automatically prefixes keys. The resolver-loader uses this
    // to give each plugin its own isolated storage namespace.
    window.createPluginStorage = function(pluginId) {
        var prefix = 'plugin.' + pluginId + '.';
        return {
            get: function(key) { return NativeBridge.storageGet(prefix + key); },
            set: function(key, value) { NativeBridge.storageSet(prefix + key, value); },
        };
    };
    // Global nativeStorage uses the "plugin._global." namespace for
    // backward compatibility with any .axe that calls it directly.
    // It can NOT access app-level keys (tokens, credentials).
    window.nativeStorage = {
        get: function(key) { return NativeBridge.storageGet('plugin._global.' + key); },
        set: function(key, value) { NativeBridge.storageSet('plugin._global.' + key, value); },
    };

    // ── Client identifier ────────────────────────────────────────────
    // Set BEFORE plugin init runs so plugins can read it for client-
    // distinguishing telemetry headers. See parachord-plugins#3 — the
    // achordion plugin is being updated to send `X-Parachord-Client:
    // <window.__parachordClient>` on every fetch so Achordion's server
    // can split metrics across desktop / android / future-ios.
    window.__parachordClient = 'android';

    // ── ScrobbleManager registry ─────────────────────────────────────
    // Public, stable contract documented in desktop CLAUDE.md
    // `## Scrobbling: inline core, plugin contract for the rest`
    // (L712-754). Plugins call `registerPlugin({id, isEnabled,
    // updateNowPlaying, scrobble})` to opt in to playback-telemetry
    // dispatch. The achordion plugin is the canonical consumer; future
    // additive write-targets (Maloja, custom analytics) use the same
    // surface.
    //
    // Native dispatch path: `ScrobbleManager.kt` builds a desktop-
    // shaped track JSON and calls
    // `__scrobbleManagerDispatch('updateNowPlaying' | 'scrobble', json)`
    // which iterates registered plugins, awaits `isEnabled()`, then
    // calls the corresponding hook. Errors per-plugin are logged via
    // `console.warn` and do not break the loop.
    //
    // Inherited filter from desktop scrobbleManager
    // (scrobbler-loader.js:75): tracks with `duration < 30s` are
    // excluded from BOTH hooks. Mirror that here so a 25s ambient
    // interlude with a verified Spotify ID won't fire either hook,
    // matching cross-platform behavior parity.
    window.scrobbleManager = {
        _plugins: [],
        registerPlugin: function(plugin) {
            if (!plugin || !plugin.id) {
                console.warn('[scrobbleManager] registerPlugin rejected: missing id');
                return;
            }
            // Replace any existing registration with the same id (re-register
            // semantics on plugin reload).
            window.scrobbleManager._plugins =
                window.scrobbleManager._plugins.filter(function(p) { return p.id !== plugin.id; });
            window.scrobbleManager._plugins.push(plugin);
            console.log('[scrobbleManager] registered plugin:', plugin.id);
        },
        unregisterPlugin: function(id) {
            var before = window.scrobbleManager._plugins.length;
            window.scrobbleManager._plugins =
                window.scrobbleManager._plugins.filter(function(p) { return p.id !== id; });
            if (window.scrobbleManager._plugins.length < before) {
                console.log('[scrobbleManager] unregistered plugin:', id);
            }
        },
    };

    /**
     * Native → JS dispatch entry point. Called from
     * `ScrobbleManager.kt`'s `dispatchNowPlaying` / `dispatchScrobble`
     * via `JsBridge.evaluate(...)`. `eventName` is `"updateNowPlaying"`
     * or `"scrobble"`. `trackJson` is a desktop-shaped track object
     * with `id`, `title`, `artist`, `album`, `duration`, `mbid`,
     * `_activeResolver`, and a `sources` map (resolverId → source with
     * confidence + per-resolver IDs).
     *
     * Returns a Promise — fire-and-forget from the native side. Don't
     * rely on the return value being readable from Kotlin (see
     * CLAUDE.md Common Mistake #27 — async IIFE returns Promise object,
     * not the resolved value). The WebView runs the loop independently.
     */
    window.__scrobbleManagerDispatch = async function(eventName, trackJson) {
        try {
            var track = JSON.parse(trackJson);
            // <30s duration filter inherited from desktop scrobbleManager
            // (scrobbler-loader.js:75). Match cross-platform behavior.
            if (track.duration && track.duration < 30) return false;
            for (var i = 0; i < window.scrobbleManager._plugins.length; i++) {
                var plugin = window.scrobbleManager._plugins[i];
                try {
                    var enabled = true;
                    if (typeof plugin.isEnabled === 'function') {
                        enabled = await plugin.isEnabled();
                    }
                    if (!enabled) continue;
                    if (typeof plugin[eventName] === 'function') {
                        await plugin[eventName](track);
                    }
                } catch (e) {
                    console.warn(
                        '[scrobbleManager] plugin', plugin.id, eventName,
                        'threw:', (e && e.message) ? e.message : e,
                    );
                }
            }
            return true;
        } catch (e) {
            console.warn('[scrobbleManager] dispatch failed:', (e && e.message) ? e.message : e);
            return false;
        }
    };

    // ── MBID resolver shim ────────────────────────────────────────────
    // `window.resolveMbidForLove(track)` returns Promise<string|null>.
    // Used by the achordion plugin's `resolveMbid(track)` fallback when
    // `track.mbid` is absent. The Kotlin side calls
    // `MbidEnrichmentService.getRecordingMbid` with the track's artist +
    // title and returns a 36-char MBID at the mapper's confidence
    // threshold, or null.
    //
    // Pattern mirrors the existing `__fetchCallbacks` async harness:
    // JS registers a callback id, native dispatches to a coroutine,
    // calls back via `evaluateJavascript` on the main thread.
    window.__resolveMbidCallbacks = {};
    var __resolveMbidIdCounter = 0;

    window.resolveMbidForLove = function(track) {
        return new Promise(function(resolve, reject) {
            var callbackId = 'mbid_' + (++__resolveMbidIdCounter);
            window.__resolveMbidCallbacks[callbackId] = function(mbidOrNull) {
                delete window.__resolveMbidCallbacks[callbackId];
                resolve(mbidOrNull || null);
            };
            try {
                var trackJson = JSON.stringify(track || {});
                NativeBridge.resolveMbidForLove(callbackId, trackJson);
            } catch (e) {
                delete window.__resolveMbidCallbacks[callbackId];
                reject(e);
            }
        });
    };

    // ── Apple Music hooks ───────────────────────────────────────────
    // applemusic.axe asks the host for these before its own iTunes Search /
    // Lookup: appleMusicSearchWithMusicKit (search, and so resolve),
    // appleMusicLookupSong (song URLs), appleMusicLookupAlbum (album URLs and
    // the album-page catalog fallback, #424) and appleMusicLookupPlaylist.
    // Desktop answers them through MusicKit's `api.music(path)` (app.js
    // ~L719-1080); here NativeBridge.appleMusicCatalogGet makes the same
    // catalog read with the app's developer token, throttled with MusicKit's
    // own catalog calls. Each is a port of desktop's hook with that call
    // swapped in, falling back to iTunes the same way. iTunes Search lags new
    // releases, so a song the catalog has ("I Know!" by Swapmeet, 2026-10)
    // used to never resolve to Apple Music.
    window.__amCatalogCallbacks = {};
    var __amCatalogIdCounter = 0;

    // GET a /v1/catalog/ path; the parsed response, or null (no token,
    // throttled, failed) so the caller falls back to iTunes.
    function __amCatalog(path) {
        return new Promise(function(resolve) {
            var callbackId = 'am_' + (++__amCatalogIdCounter);
            window.__amCatalogCallbacks[callbackId] = function(body) {
                delete window.__amCatalogCallbacks[callbackId];
                resolve(body || null);
            };
            try {
                NativeBridge.appleMusicCatalogGet(callbackId, path);
            } catch (e) {
                delete window.__amCatalogCallbacks[callbackId];
                resolve(null);
            }
        });
    }

    function __amArt(artwork) {
        return artwork && artwork.url ? artwork.url.replace('{w}', '500').replace('{h}', '500') : null;
    }

    function __amSong(song, storefront, albumOverride) {
        var a = song.attributes || {};
        return {
            id: 'applemusic-' + song.id,
            title: a.name,
            artist: a.artistName,
            album: albumOverride || a.albumName || 'Unknown Album',
            duration: Math.floor((a.durationInMillis || 0) / 1000),
            sources: ['applemusic'],
            appleMusicId: String(song.id),
            appleMusicUrl: a.url || ('https://music.apple.com/' + storefront + '/song/' + song.id),
            albumArt: __amArt(a.artwork),
            previewUrl: (a.previews && a.previews[0] && a.previews[0].url) || null,
            isrc: a.isrc || null,
            audioTraits: a.audioTraits || [],
        };
    }

    function __itunesTrack(track) {
        return {
            id: 'applemusic-' + track.trackId,
            title: track.trackName,
            artist: track.artistName,
            album: track.collectionName || 'Single',
            duration: Math.floor((track.trackTimeMillis || 0) / 1000),
            sources: ['applemusic'],
            appleMusicId: String(track.trackId),
            appleMusicUrl: track.trackViewUrl,
            albumArt: track.artworkUrl100 ? track.artworkUrl100.replace('100x100', '500x500') : null,
            previewUrl: track.previewUrl,
            genre: track.primaryGenreName,
            trackNumber: track.trackNumber,
            discNumber: track.discNumber,
        };
    }

    function __byDiscAndTrack(a, b) {
        return a.discNumber !== b.discNumber ? a.discNumber - b.discNumber : a.trackNumber - b.trackNumber;
    }

    window.appleMusicSearchWithMusicKit = async function(query, storefront, limit) {
        storefront = storefront || 'us';
        limit = limit || 20;
        var data = await __amCatalog('/v1/catalog/' + encodeURIComponent(storefront) +
            '/search?types=songs&limit=' + Math.min(limit, 25) + '&term=' + encodeURIComponent(query));
        if (data) {
            var songs = (data.results && data.results.songs && data.results.songs.data) || [];
            return songs.map(function(s) { return __amSong(s, storefront); });
        }
        var response = await window.iTunesRateLimiter.fetch(
            'https://itunes.apple.com/search?term=' + encodeURIComponent(query) +
            '&media=music&entity=song&limit=' + limit + '&country=' + storefront);
        if (!response.ok) return [];
        var json = await response.json();
        return ((json && json.results) || []).map(__itunesTrack);
    };

    window.appleMusicLookupSong = async function(songId, storefront) {
        storefront = storefront || 'us';
        var data = await __amCatalog('/v1/catalog/' + encodeURIComponent(storefront) + '/songs/' + encodeURIComponent(songId));
        var song = data && data.data && data.data[0];
        if (song) {
            var t = __amSong(song, storefront);
            t.album = (song.attributes && song.attributes.albumName) || 'Single';
            t.genre = song.attributes && song.attributes.genreNames && song.attributes.genreNames[0];
            return t;
        }
        var response = await window.iTunesRateLimiter.fetch(
            'https://itunes.apple.com/lookup?id=' + songId + '&entity=song&country=' + storefront);
        if (!response.ok) return null;
        var json = await response.json();
        var results = (json && json.results) || [];
        var track = results.find(function(r) { return r.wrapperType === 'track'; }) || results[0];
        return track ? __itunesTrack(track) : null;
    };

    window.appleMusicLookupAlbum = async function(albumId, storefront) {
        storefront = storefront || 'us';
        var data = await __amCatalog('/v1/catalog/' + encodeURIComponent(storefront) +
            '/albums/' + encodeURIComponent(albumId) + '?include=tracks');
        var album = data && data.data && data.data[0];
        if (album) {
            var a = album.attributes || {};
            var albumArt = __amArt(a.artwork);
            var songs = (album.relationships && album.relationships.tracks && album.relationships.tracks.data) || [];
            var tracks = songs.map(function(song, idx) {
                var t = __amSong(song, storefront, a.name);
                t.albumArt = albumArt;
                t.trackNumber = (song.attributes && song.attributes.trackNumber) || (idx + 1);
                t.discNumber = (song.attributes && song.attributes.discNumber) || 1;
                if (!t.audioTraits.length) t.audioTraits = a.audioTraits || [];
                return t;
            });
            tracks.sort(__byDiscAndTrack);
            return {
                id: 'applemusic-album-' + albumId,
                name: a.name,
                artist: a.artistName,
                albumArt: albumArt,
                releaseDate: a.releaseDate,
                trackCount: a.trackCount || tracks.length,
                tracks: tracks,
                url: a.url,
            };
        }
        var response = await window.iTunesRateLimiter.fetch(
            'https://itunes.apple.com/lookup?id=' + albumId + '&entity=song&limit=200&country=' + storefront);
        if (!response.ok) return null;
        var json = await response.json();
        var results = (json && json.results) || [];
        if (!results.length) return null;
        var info = results.find(function(r) { return r.wrapperType === 'collection'; });
        var itunesTracks = results.filter(function(r) { return r.wrapperType === 'track'; }).map(__itunesTrack);
        itunesTracks.sort(__byDiscAndTrack);
        return {
            id: 'applemusic-album-' + albumId,
            name: info ? info.collectionName : 'Unknown Album',
            artist: info ? info.artistName : (itunesTracks[0] ? itunesTracks[0].artist : 'Unknown Artist'),
            albumArt: info && info.artworkUrl100 ? info.artworkUrl100.replace('100x100', '500x500') : null,
            releaseDate: info ? info.releaseDate : null,
            trackCount: info ? info.trackCount : itunesTracks.length,
            tracks: itunesTracks,
        };
    };

    window.appleMusicSearchAlbumsWithMusicKit = async function(term, storefront, limit) {
        storefront = storefront || 'us';
        limit = limit || 10;
        var data = await __amCatalog('/v1/catalog/' + encodeURIComponent(storefront) +
            '/search?types=albums&limit=' + Math.min(limit, 25) + '&term=' + encodeURIComponent(term));
        // null: catalog unreachable, so the plugin asks iTunes itself.
        if (!data) return null;
        var albums = (data.results && data.results.albums && data.results.albums.data) || [];
        return albums
            .filter(function(a) { return a.attributes && a.attributes.name && a.attributes.url; })
            .map(function(a) {
                var at = a.attributes;
                return {
                    id: 'applemusic-album-' + a.id,
                    name: at.name,
                    artist: at.artistName || '',
                    albumArt: __amArt(at.artwork),
                    releaseDate: at.releaseDate || null,
                    trackCount: at.trackCount || null,
                    url: at.url,
                };
            });
    };

    window.appleMusicLookupPlaylist = async function(playlistId, storefront) {
        storefront = storefront || 'us';
        var data = await __amCatalog('/v1/catalog/' + encodeURIComponent(storefront) +
            '/playlists/' + encodeURIComponent(playlistId) + '?include=tracks');
        var playlist = data && data.data && data.data[0];
        if (!playlist) return null;
        var p = playlist.attributes || {};
        var playlistArt = __amArt(p.artwork);
        var rel = (playlist.relationships && playlist.relationships.tracks) || {};
        var all = rel.data || [];
        var next = rel.next;
        while (next) {
            var page = await __amCatalog(next);
            if (!page) break;
            all = all.concat(page.data || []);
            next = page.next || null;
        }
        var tracks = all.map(function(song) {
            var t = __amSong(song, storefront);
            t.albumArt = t.albumArt || playlistArt;
            return t;
        });
        return {
            id: 'applemusic-playlist-' + playlistId,
            name: p.name,
            owner: p.curatorName || '',
            albumArt: playlistArt,
            trackCount: tracks.length,
            tracks: tracks,
            url: p.url,
        };
    };

    console.log('Parachord JS runtime: polyfills loaded');
</script>

<!-- Load the resolver-loader.js from desktop (unchanged) -->
<script src="resolver-loader.js"></script>

<script>
    // Create global ResolverLoader instance for PluginManager to use
    if (typeof ResolverLoader !== 'undefined') {
        window.__resolverLoader = new ResolverLoader();
        console.log('Parachord JS runtime: ResolverLoader ready');
    } else {
        console.error('ResolverLoader class not found — resolver-loader.js failed to load');
    }
</script>
</body>
</html>
