# Robolectric runs unit tests against this Android SDK, independent of the app's
# targetSdk. Pinned to 35 because Robolectric only runs SDK 36 (Android 16) on
# JDK 21, while this project (and CI) build on JDK 17 — see targetSdk 36 bump.
# These tests exercise our own logic, not OS-version behavior, so the runtime
# SDK doesn't need to track targetSdk. Raise this when the project moves to JDK 21.
sdk=35
